<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>StarkAC Trainees</title><link rel="stylesheet" href="style.css"></head><body>
<nav class="starkac-nav"><a class="starkac-brand" href="index.html">Stark<span>AC</span> staff</a><a href="../pages/admin.html">Main admin</a></nav><main class="starkac-shell"><section class="dashboard-header"><div><span class="eyebrow">Staff workspace</span><h1>StarkAC trainees</h1></div><span class="status-pill" id="staffStatus">Loading</span></section><section class="starkac-grid"><div class="dashboard-card"><h2>Add learner activity</h2><form id="activityForm"><div class="form-grid"><label>Trainee email<input type="email" name="trainee_email" required></label><label>Activity type<select name="activity_type"><option>lesson</option><option>assignment</option><option>assessment</option><option>mentor_note</option><option>status_update</option></select></label><label>Title<input name="title" required></label><label>Status<select name="status"><option>planned</option><option>in_progress</option><option>completed</option><option>review</option></select></label><label class="full">Description<textarea name="description" rows="3"></textarea></label></div><div class="form-actions"><button class="btn" type="submit">Save activity</button></div><p class="form-status" id="activityStatus"></p></form></div><div class="dashboard-card"><h2>Waiting list</h2><div id="traineeList" class="activity-list"></div></div></section></main><script src="../js/supabase.js"></script><script src="../js/main.js"></script><script>
(async function(){const session=getSession();if(!session.accessToken){location.href='../pages/admin.html';return;}const rows=await fetchStarkAcTraineesAll();document.getElementById('staffStatus').textContent=`${rows.length} learners`;document.getElementById('traineeList').innerHTML=rows.length?rows.map(row=>`<div class="activity-row"><strong>${row.full_name}<br><small>${row.email}</small></strong><span>${row.status} · ${row.plan}</span></div>`).join(''):'<p>No learners yet.</p>';document.getElementById('activityForm').addEventListener('submit',async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.currentTarget));const status=document.getElementById('activityStatus');status.textContent=await saveStarkAcActivity(data)?'Activity saved.':'Could not save activity.';if(status.textContent==='Activity saved.')e.currentTarget.reset();});})().catch(()=>{document.getElementById('staffStatus').textContent='Unable to load trainees';});
</script></body></html>
